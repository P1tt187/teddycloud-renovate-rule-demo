services:
  teddycloud:
    container_name: teddycloud
    hostname: teddycloud
    image: ghcr.io/toniebox-reverse-engineering/teddycloud:tc_v0.7.1_alpine@sha256:53272d5b6241a36abedad60fc71b5533b4e3bf1df5a0638c76b3f6c11d28e95d
    # ports:
    #  - 80:80 #optional (for the webinterface)
    #  - 8443:8443 #optional (for the webinterface)
    #  - 443:443 #Port is needed for the connection for the box, must not be changed!
    volumes:
      - certs:/teddycloud/certs
      - config:/teddycloud/config
      - content:/teddycloud/data/content
      - library:/teddycloud/data/library
      - firmware:/teddycloud/data/firmware
      - cache:/teddycloud/data/cache
    restart: unless-stopped
  teddycloud2:
    image: ghcr.io/toniebox-reverse-engineering/teddycloud:tc_v0.7.1@sha256:870fd1ab0fc5175f72f37a424f3dd3be6da82f90ca1de6fc6b18322963139975
volumes:
  certs:
  config:
  content:
  library:
  firmware:
  cache: